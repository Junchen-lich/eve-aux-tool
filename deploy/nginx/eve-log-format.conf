# EVE 辅助工具 —— Nginx 日志格式定义
#
# ★ log_format 只能在 http 段定义，不能写在 server 块里。
#   部署时复制到 /etc/nginx/conf.d/（该目录默认被 http 段 include）：
#     sudo cp eve-log-format.conf /etc/nginx/conf.d/
#
# 记录真实客户端 IP、请求、状态码与耗时 —— 便于排查与审计。

log_format eve_main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'ua="$http_user_agent" fwd="$http_x_forwarded_for"';

# ---------- 限流区 ----------
# ★ limit_req_zone 同样只能在 http 段定义，不能写在 server 块里。

# 普通接口：每 IP 每秒 10 次
limit_req_zone $binary_remote_addr zone=eve_api:10m rate=10r/s;

# 登录与注册：更严，每 IP 每分钟 5 次（防口令爆破与批量注册）
limit_req_zone $binary_remote_addr zone=eve_login:10m rate=5r/m;
