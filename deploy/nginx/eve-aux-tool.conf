# EVE 辅助工具 —— Nginx 反向代理配置
#
# 部署步骤：
#   1. 域名解析到服务器公网 IP
#   2. 申请证书：certbot --nginx -d eve.example.com
#   3. 复制本文件到 /etc/nginx/sites-available/eve-aux-tool 并改域名
#   4. ln -s ../sites-available/eve-aux-tool /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# ★ 安全要点：
#   - Node 只监听 127.0.0.1，公网入口唯一且必经 TLS
#   - /healthz 允许匿名访问（负载均衡探活需要），其余全部由应用层校验
#   - 限流按 IP，兼顾防刷与多用户共用同一出口 IP 的情况（家庭宽带常见）

# ---------- HTTP：全部跳转到 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name eve.example.com;

    # ACME 证书验证目录（certbot 需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主服务 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eve.example.com;

    # ---------- TLS ----------
    ssl_certificate     /etc/letsencrypt/live/eve.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eve.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：确认 HTTPS 稳定后再开启（开启后浏览器会强制 HTTPS）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # ---------- 上传大小（无上传接口，限制很小） ----------
    client_max_body_size 1m;

    # ---------- 访问日志：真实客户端 IP ----------
    log_format eve_main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/eve-aux-tool.access.log eve_main;
    error_log  /var/log/nginx/eve-aux-tool.error.log warn;

    # ---------- 限流 ----------
    # 普通接口：每 IP 每秒 10 次
    limit_req_zone $binary_remote_addr zone=eve_api:10m rate=10r/s;
    # 登录接口：更严，每 IP 每分钟 5 次（防口令爆破）
    limit_req_zone $binary_remote_addr zone=eve_login:10m rate=5r/m;

    # ---------- 健康检查：匿名可访问 ----------
    location = /healthz {
        proxy_pass http://127.0.0.1:8657/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;   # 探活请求不记日志，避免刷屏
    }

    # ---------- 登录与注册：严格限流 ----------
    location ~ ^/api/(login|register)$ {
        limit_req zone=eve_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 其余全部接口：常规限流 ----------
    location / {
        limit_req zone=eve_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSO 回调需等待上游 EVE 授权，给足超时
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # 数据表较大，关闭缓冲
        proxy_buffering off;
    }

    # ---------- 静态数据表：可缓存 ----------
    location ~* ^/data/.*\.json$ {
        proxy_pass http://127.0.0.1:8657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
